
[project]
name = "wr-movementiq"
version = "0.1.0"
description = "NFL Big Data Bowl 2027 wide receiver movement research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "duckdb>=1.2.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3"]
